name: Colony Clash CI

on:
  push:
    branches: ["main", "develop", "stage/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend HTTPS base URL"
        required: false
        default: "https://api.example.com"

permissions:
  contents: read

jobs:
  backend:
    name: Backend TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: Node tests
        run: npm test
      - name: Upload backend dist
        uses: actions/upload-artifact@v7
        with:
          name: backend-dist
          path: backend/dist
          if-no-files-found: error

  android:
    name: Android debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic
      - name: Build all debug APKs
        id: android_build
        working-directory: android
        env:
          INPUT_API_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          set +e

          API_URL="${INPUT_API_URL:-https://api.example.com}"

          gradle --no-daemon \
            --stacktrace \
            --warning-mode all \
            -PAPI_BASE_URL="$API_URL" \
            assemblePlayDebug \
            assembleIranDebug \
            assembleChinaDebug \
            2>&1 | tee ../android-build.log

          RC=${PIPESTATUS[0]}

          echo "rc=$RC" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-log
          path: android-build.log
          if-no-files-found: warn

      - name: Fail if Android compile failed
        if: steps.android_build.outputs.rc != '0'
        run: |
          echo "Android Gradle build failed with exit code ${{ steps.android_build.outputs.rc }}"
          exit 1
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/play/debug/app-play-debug.apk dist/ColonyClash-play-debug.apk
          cp android/app/build/outputs/apk/iran/debug/app-iran-debug.apk dist/ColonyClash-iran-debug.apk
          cp android/app/build/outputs/apk/china/debug/app-china-debug.apk dist/ColonyClash-china-debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: colony-clash-debug-apks
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
