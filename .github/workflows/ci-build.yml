name: Colony Clash CI

on:
  push:
    branches: ["main", "develop", "stage/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend HTTPS base URL"
        required: false
        default: "https://api.example.com"

permissions:
  contents: read

jobs:
  backend:
    name: Backend TypeScript build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: Node tests
        run: npm test
      - name: Upload backend dist
        uses: actions/upload-artifact@v7
        with:
          name: backend-dist
          path: backend/dist
          if-no-files-found: error

  android:
    name: Android debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic
      - name: Build Android flavors with diagnostics
        id: android_build
        working-directory: android
        env:
          INPUT_API_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          set +e

          API_URL="${INPUT_API_URL:-https://api.example.com}"

          FAILED_FLAVOR=""
          FAILED_RC=0
          ERROR_LINE=""

          build_flavor() {
            FLAVOR="$1"
            TASK="$2"
            LOG="../android-${FLAVOR}.log"

            echo "=========================================="
            echo " BUILDING FLAVOR: $FLAVOR"
            echo " TASK: $TASK"
            echo "=========================================="

            gradle --no-daemon \
              --stacktrace \
              --warning-mode all \
              -PAPI_BASE_URL="$API_URL" \
              "$TASK" \
              2>&1 | tee "$LOG"

            RC=${PIPESTATUS[0]}

            if [ "$RC" -ne 0 ]; then
              FAILED_FLAVOR="$FLAVOR"
              FAILED_RC="$RC"

              ERROR_LINE="$(grep -E \
                '^e: |Unresolved reference|Argument type mismatch|Type mismatch|Cannot infer|Overload resolution ambiguity|No value passed|None of the following candidates|This API is deprecated|Compilation error' \
                "$LOG" | head -n 1 || true)"

              if [ -z "$ERROR_LINE" ]; then
                ERROR_LINE="$(grep -Ei \
                  'error:|FAILURE:|Execution failed|Could not resolve|Could not find|Caused by:' \
                  "$LOG" | head -n 1 || true)"
              fi

              [ -n "$ERROR_LINE" ] || ERROR_LINE="Unknown Android compile failure"

              echo
              echo "::error title=Android $FLAVOR compile failure::$ERROR_LINE"

              return "$RC"
            fi

            return 0
          }

          build_flavor "iran" "assembleIranDebug"
          RC=$?

          if [ "$RC" -eq 0 ]; then
            build_flavor "china" "assembleChinaDebug"
            RC=$?
          fi

          if [ "$RC" -eq 0 ]; then
            build_flavor "play" "assemblePlayDebug"
            RC=$?
          fi

          if [ "$RC" -ne 0 ]; then
            SHORT_ERROR="$(printf '%s' "$ERROR_LINE" | head -c 170)"

            ERROR_B64="$(printf '%s' "$SHORT_ERROR" \
              | base64 -w0 \
              | tr '+/' '-_' \
              | tr -d '=')"

            [ -n "$ERROR_B64" ] || ERROR_B64="unknown"
          else
            FAILED_FLAVOR="none"
            ERROR_B64="success"
          fi

          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "failed_flavor=$FAILED_FLAVOR" >> "$GITHUB_OUTPUT"
          echo "error_b64=$ERROR_B64" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Upload Android diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-diagnostic-${{ steps.android_build.outputs.failed_flavor }}-${{ steps.android_build.outputs.error_b64 }}
          path: |
            android-iran.log
            android-china.log
            android-play.log
          if-no-files-found: ignore

      - name: Fail if Android compile failed
        if: steps.android_build.outputs.rc != '0'
        run: |
          echo "FAILED_FLAVOR=${{ steps.android_build.outputs.failed_flavor }}"
          echo "Android build failed."
          exit 1

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/play/debug/app-play-debug.apk dist/ColonyClash-play-debug.apk
          cp android/app/build/outputs/apk/iran/debug/app-iran-debug.apk dist/ColonyClash-iran-debug.apk
          cp android/app/build/outputs/apk/china/debug/app-china-debug.apk dist/ColonyClash-china-debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: colony-clash-debug-apks
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
