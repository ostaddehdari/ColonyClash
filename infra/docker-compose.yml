services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: colony
      POSTGRES_USER: colony
      POSTGRES_PASSWORD: colony_dev_only
    ports: ["5432:5432"]
    volumes:
      - colony_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colony -d colony"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - colony_redis:/data

volumes:
  colony_pg:
  colony_redis:
